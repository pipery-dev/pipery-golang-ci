name: 'Pipery Go CI'
description: 'CI pipeline for Go: SAST, SCA, lint, build, test, versioning, packaging, release, reintegration'
inputs:
  project_path:
    description: 'Path to the project source tree the action should operate on.'
    required: false
    default: '.'
  config_file:
    description: 'Path to Pipery config file.'
    required: false
    default: '.pipery/config.yaml'
  go_version:
    description: 'Go version to use.'
    required: false
    default: '1.22'
  skip_sast:
    description: 'Skip SAST step.'
    required: false
    default: 'false'
  skip_sca:
    description: 'Skip SCA step.'
    required: false
    default: 'false'
  skip_lint:
    description: 'Skip lint step.'
    required: false
    default: 'false'
  skip_build:
    description: 'Skip build step.'
    required: false
    default: 'false'
  tests_path:
    description: 'Go package path for tests (e.g. ./pkg/...). Defaults to ./...'
    required: false
    default: './...'
  target_platforms:
    description: 'Comma or whitespace separated GOOS/GOARCH targets for cross-platform compilation, e.g. linux/amd64,darwin/arm64,windows/amd64. Empty builds the host platform.'
    required: false
    default: ''
  skip_test:
    description: 'Skip test step.'
    required: false
    default: 'false'
  skip_versioning:
    description: 'Skip versioning step.'
    required: false
    default: 'false'
  skip_packaging:
    description: 'Skip packaging step.'
    required: false
    default: 'false'
  skip_release:
    description: 'Skip release step.'
    required: false
    default: 'false'
  skip_reintegration:
    description: 'Skip reintegration step.'
    required: false
    default: 'false'
  version_bump:
    description: 'Version bump type: patch, minor, or major.'
    required: false
    default: 'patch'
  github_token:
    description: 'GitHub token for release and reintegration steps.'
    required: false
    default: ''
  log_file:
    description: 'Path to the JSONL log file written during the run.'
    required: false
    default: 'pipery.jsonl'
  registry:
    description: 'Container registry for packaging.'
    required: false
    default: 'ghcr.io'
  image_name:
    description: 'Container image name.'
    required: false
    default: ''
runs:
  using: composite
  steps:
    - id: main
      shell: bash
      run: |
        set -euo pipefail
        project_path="${INPUT_PROJECT_PATH:-${PIPERY_TEST_PROJECT_PATH:-.}}"
        log_path="${PIPERY_LOG_PATH:-pipery.jsonl}"
        if [ ! -d "$project_path" ]; then
          echo "Expected project path to exist: $project_path" >&2
          exit 1
        fi
        printf '{"event":"build","status":"success","project_path":"%s"}\n' "$project_path" > "$log_path"
        echo "Implement your action logic here for $project_path."
branding:
  icon: package
  color: blue
