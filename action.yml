name: 'Pipery Go CI'
description: 'CI pipeline for Go: SAST, SCA, lint, build, test, versioning, packaging, release, reintegration'
inputs:
  project_path:
    description: 'Path to the project source tree the action should operate on.'
    required: false
    default: '.'
  config_file:
    description: 'Path to Pipery config file.'
    required: false
    default: '.pipery/config.yaml'
  go_version:
    description: 'Go version to use.'
    required: false
    default: '1.22'
  skip_sast:
    description: 'Skip SAST step.'
    required: false
    default: 'false'
  skip_sca:
    description: 'Skip SCA step.'
    required: false
    default: 'false'
  skip_lint:
    description: 'Skip lint step.'
    required: false
    default: 'false'
  skip_build:
    description: 'Skip build step.'
    required: false
    default: 'false'
  tests_path:
    description: 'Go package path for tests (e.g. ./pkg/...). Defaults to ./...'
    required: false
    default: './...'
  target_platforms:
    description: 'Comma or whitespace separated GOOS/GOARCH targets for cross-platform compilation, e.g. linux/amd64,darwin/arm64,windows/amd64. Empty builds the host platform.'
    required: false
    default: ''
  skip_test:
    description: 'Skip test step.'
    required: false
    default: 'false'
  skip_versioning:
    description: 'Skip versioning step.'
    required: false
    default: 'false'
  skip_packaging:
    description: 'Skip packaging step.'
    required: false
    default: 'false'
  skip_release:
    description: 'Skip release step.'
    required: false
    default: 'false'
  skip_reintegration:
    description: 'Skip reintegration step.'
    required: false
    default: 'false'
  version_bump:
    description: 'Version bump type: patch, minor, or major.'
    required: false
    default: 'patch'
  github_token:
    description: 'GitHub token for release and reintegration steps.'
    required: false
    default: ''
  log_file:
    description: 'Path to the JSONL log file written during the run.'
    required: false
    default: 'pipery.jsonl'
  registry:
    description: 'Container registry for packaging.'
    required: false
    default: 'ghcr.io'
  image_name:
    description: 'Container image name.'
    required: false
    default: ''
  release_docker_image:
    description: 'Build and push a Docker image for the application.'
    required: false
    default: 'false'
  docker_registry:
    description: 'Docker registry host used for login and image prefix.'
    required: false
    default: 'ghcr.io'
  docker_image:
    description: 'Docker image name without tag. Defaults to image_name, then the GitHub repository.'
    required: false
    default: ''
  docker_tags:
    description: 'Comma, space, or newline separated Docker tags. Defaults to sha-<short sha>.'
    required: false
    default: ''
  docker_context:
    description: 'Docker build context, relative to project_path unless absolute.'
    required: false
    default: '.'
  dockerfile:
    description: 'Dockerfile path, relative to project_path unless absolute.'
    required: false
    default: 'Dockerfile'
  docker_platforms:
    description: 'Comma separated Docker target platforms for buildx, e.g. linux/amd64,linux/arm64. Empty uses a regular Docker build for the runner platform.'
    required: false
    default: ''
  docker_username:
    description: 'Docker registry username. For ghcr.io this is usually the GitHub actor.'
    required: false
    default: ''
  docker_password:
    description: 'Docker registry password or token.'
    required: false
    default: ''
  docker_push_latest:
    description: 'Also tag and push latest.'
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    - uses: actions/setup-go@v5
      with:
        go-version: ${{ inputs.go_version }}
    - name: Setup QEMU
      if: inputs.release_docker_image == 'true' && inputs.docker_platforms != ''
      uses: docker/setup-qemu-action@v3
    - name: Setup Docker Buildx
      if: inputs.release_docker_image == 'true' && inputs.docker_platforms != ''
      uses: docker/setup-buildx-action@v3
    - id: main
      shell: bash
      env:
        INPUT_PROJECT_PATH: ${{ inputs.project_path }}
        INPUT_CONFIG_FILE: ${{ inputs.config_file }}
        INPUT_GO_VERSION: ${{ inputs.go_version }}
        INPUT_SKIP_SAST: ${{ inputs.skip_sast }}
        INPUT_SKIP_SCA: ${{ inputs.skip_sca }}
        INPUT_SKIP_LINT: ${{ inputs.skip_lint }}
        INPUT_SKIP_BUILD: ${{ inputs.skip_build }}
        INPUT_TESTS_PATH: ${{ inputs.tests_path }}
        INPUT_TARGET_PLATFORMS: ${{ inputs.target_platforms }}
        INPUT_SKIP_TEST: ${{ inputs.skip_test }}
        INPUT_SKIP_VERSIONING: ${{ inputs.skip_versioning }}
        INPUT_SKIP_PACKAGING: ${{ inputs.skip_packaging }}
        INPUT_SKIP_RELEASE: ${{ inputs.skip_release }}
        INPUT_SKIP_REINTEGRATION: ${{ inputs.skip_reintegration }}
        INPUT_VERSION_BUMP: ${{ inputs.version_bump }}
        INPUT_GITHUB_TOKEN: ${{ inputs.github_token }}
        INPUT_LOG_FILE: ${{ inputs.log_file }}
        INPUT_REGISTRY: ${{ inputs.registry }}
        INPUT_IMAGE_NAME: ${{ inputs.image_name }}
        INPUT_RELEASE_DOCKER_IMAGE: ${{ inputs.release_docker_image }}
        INPUT_DOCKER_REGISTRY: ${{ inputs.docker_registry }}
        INPUT_DOCKER_IMAGE: ${{ inputs.docker_image }}
        INPUT_DOCKER_TAGS: ${{ inputs.docker_tags }}
        INPUT_DOCKER_CONTEXT: ${{ inputs.docker_context }}
        INPUT_DOCKERFILE: ${{ inputs.dockerfile }}
        INPUT_DOCKER_PLATFORMS: ${{ inputs.docker_platforms }}
        INPUT_DOCKER_USERNAME: ${{ inputs.docker_username }}
        INPUT_DOCKER_PASSWORD: ${{ inputs.docker_password }}
        INPUT_DOCKER_PUSH_LATEST: ${{ inputs.docker_push_latest }}
      run: |
        set -euo pipefail
        "$GITHUB_ACTION_PATH/src/main.sh"
branding:
  icon: package
  color: blue
