owner = "pipery-dev"
action_name = "pipery-golang-ci"
title = "Pipery Go CI"
description = "CI pipeline for Go: SAST, SCA, lint, build, test, versioning, packaging, release, reintegration"
marketplace_category = "continuous-integration"
author = "pipery-dev"
action_type = "composite"
default_branch = "main"
version = "1.1.0"
repository_visibility = "public"
icon = "assets/icon.png"
test_command = ""
test_project_path = "test-project"
test_project_input = "project_path"
test_log_path = "pipery.jsonl"
test_log_success_values = ["success", "succeeded", "passed", "ok"]
cleanup_paths = ["pipery.jsonl"]

[[inputs]]
name = "project_path"
description = "Path to the project source tree the action should operate on."
required = false
default = "."

[[inputs]]
name = "config_file"
description = "Path to Pipery config file."
required = false
default = ".pipery/config.yaml"

[[inputs]]
name = "go_version"
description = "Go version to use."
required = false
default = "1.22"

[[inputs]]
name = "skip_sast"
description = "Skip SAST step."
required = false
default = "false"

[[inputs]]
name = "skip_sca"
description = "Skip SCA step."
required = false
default = "false"

[[inputs]]
name = "skip_lint"
description = "Skip lint step."
required = false
default = "false"

[[inputs]]
name = "skip_build"
description = "Skip build step."
required = false
default = "false"

[[inputs]]
name = "tests_path"
description = "Go package path for tests (e.g. ./pkg/...). Defaults to ./..."
required = false
default = "./..."

[[inputs]]
name = "target_platforms"
description = "Comma or whitespace separated GOOS/GOARCH targets for cross-platform compilation, e.g. linux/amd64,darwin/arm64,windows/amd64. Empty builds the host platform."
required = false
default = ""

[[inputs]]
name = "skip_test"
description = "Skip test step."
required = false
default = "false"

[[inputs]]
name = "skip_versioning"
description = "Skip versioning step."
required = false
default = "false"

[[inputs]]
name = "skip_packaging"
description = "Skip packaging step."
required = false
default = "false"

[[inputs]]
name = "skip_release"
description = "Skip release step."
required = false
default = "false"

[[inputs]]
name = "skip_reintegration"
description = "Skip reintegration step."
required = false
default = "false"

[[inputs]]
name = "version_bump"
description = "Version bump type: patch, minor, or major."
required = false
default = "patch"

[[inputs]]
name = "github_token"
description = "GitHub token for release and reintegration steps."
required = false
default = ""

[[inputs]]
name = "log_file"
description = "Path to the JSONL log file written during the run."
required = false
default = "pipery.jsonl"

[[inputs]]
name = "registry"
description = "Container registry for packaging."
required = false
default = "ghcr.io"

[[inputs]]
name = "image_name"
description = "Container image name."
required = false
default = ""

[[inputs]]
name = "release_docker_image"
description = "Build and push a Docker image for the application."
required = false
default = "false"

[[inputs]]
name = "docker_registry"
description = "Docker registry host used for login and image prefix."
required = false
default = "ghcr.io"

[[inputs]]
name = "docker_image"
description = "Docker image name without tag. Defaults to image_name, then the GitHub repository."
required = false
default = ""

[[inputs]]
name = "docker_tags"
description = "Comma, space, or newline separated Docker tags. Defaults to sha-<short sha>."
required = false
default = ""

[[inputs]]
name = "docker_context"
description = "Docker build context, relative to project_path unless absolute."
required = false
default = "."

[[inputs]]
name = "dockerfile"
description = "Dockerfile path, relative to project_path unless absolute."
required = false
default = "Dockerfile"

[[inputs]]
name = "docker_platforms"
description = "Comma separated Docker target platforms for buildx, e.g. linux/amd64,linux/arm64. Empty uses a regular Docker build for the runner platform."
required = false
default = ""

[[inputs]]
name = "docker_username"
description = "Docker registry username. For ghcr.io this is usually the GitHub actor."
required = false
default = ""

[[inputs]]
name = "docker_password"
description = "Docker registry password or token."
required = false
default = ""

[[inputs]]
name = "docker_push_latest"
description = "Also tag and push latest."
required = false
default = "false"

[[test_log_required_fields]]
name = "event"
value = "build"
