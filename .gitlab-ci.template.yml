# GitLab CI Pipeline for pipery-golang-ci
# This is the GitLab CI equivalent of the GitHub Actions Go CI workflow
#
# SETUP INSTRUCTIONS:
# 1. Copy this file to your pipery-golang-ci repository as .gitlab-ci.yml
# 2. Update the variables section with your specific registry/credentials
# 3. Configure protected variables in GitLab CI/CD settings (Settings > CI/CD > Variables)
# 4. Set any skip_* variables to 'true' if you want to disable specific steps
#
# VARIABLES:
# These correspond to the GitHub Action inputs. Customize as needed.

variables:
  PROJECT_PATH: "."
  CONFIG_FILE: ".pipery/config.yaml"
  GO_VERSION: "1.22"
  TESTS_PATH: "./..."
  SKIP_SAST: "false"
  SKIP_SCA: "false"
  SKIP_LINT: "false"
  SKIP_BUILD: "false"
  SKIP_TEST: "false"
  SKIP_VERSIONING: "false"
  SKIP_PACKAGING: "false"
  SKIP_RELEASE: "false"
  SKIP_REINTEGRATION: "false"
  VERSION_BUMP: "patch"
  REGISTRY: "ghcr.io"
  IMAGE_NAME: ""
  GITHUB_TOKEN: ""
  LOG_FILE: "pipery.jsonl"
  TARGET_BRANCH: "main"

stages:
  - checkout
  - setup
  - sast
  - sca
  - lint
  - build
  - test
  - versioning
  - packaging
  - release
  - reintegration
  - logs

# ============================================================================
# CHECKOUT & SETUP STAGE
# ============================================================================

checkout:
  stage: checkout
  image: alpine:latest
  script:
    - echo "Repository already checked out by GitLab CI"
    - ls -la
  artifacts:
    paths:
      - .git/
    expire_in: 1 day

setup:
  stage: setup
  image: golang:${GO_VERSION}-alpine
  script:
    - echo "Setting up Go CI environment..."
    - go version
    - cd $PROJECT_PATH
    - go mod download
    - go mod verify
    - echo "Setup complete"
  artifacts:
    paths:
      - $PROJECT_PATH/go.sum
      - $PROJECT_PATH/go.mod
    expire_in: 1 day

# ============================================================================
# SECURITY STAGES
# ============================================================================

sast_scan:
  stage: sast
  image: golang:${GO_VERSION}-alpine
  script:
    # Refactored: Call shared script instead of inline logic
    - bash ./src/step-sast.sh
  env:
    INPUT_PROJECT_PATH: $PROJECT_PATH
    INPUT_CONFIG_FILE: $CONFIG_FILE
    INPUT_LOG_FILE: $LOG_FILE
  allow_failure: true
  rules:
    - if: '$SKIP_SAST == "true"'
      when: never
    - when: on_success
  artifacts:
    paths:
      - $LOG_FILE
    expire_in: 30 days

sca_scan:
  stage: sca
  image: golang:${GO_VERSION}-alpine
  script:
    # Refactored: Call shared script instead of inline logic
    - bash ./src/step-sca.sh
  env:
    INPUT_PROJECT_PATH: $PROJECT_PATH
    INPUT_CONFIG_FILE: $CONFIG_FILE
    INPUT_LOG_FILE: $LOG_FILE
  allow_failure: true
  rules:
    - if: '$SKIP_SCA == "true"'
      when: never
    - when: on_success
  artifacts:
    paths:
      - $LOG_FILE
    expire_in: 30 days

# ============================================================================
# LINT STAGE
# ============================================================================

lint:
  stage: lint
  image: golang:${GO_VERSION}-alpine
  script:
    # Refactored: Call shared script instead of inline logic
    - bash ./src/step-lint.sh
  env:
    INPUT_PROJECT_PATH: $PROJECT_PATH
    INPUT_LOG_FILE: $LOG_FILE
  rules:
    - if: '$SKIP_LINT == "true"'
      when: never
    - when: on_success
  allow_failure: true

# ============================================================================
# BUILD STAGE
# ============================================================================

build:
  stage: build
  image: golang:${GO_VERSION}-alpine
  script:
    # Refactored: Call shared script instead of inline logic
    - bash ./src/step-build.sh
  env:
    INPUT_PROJECT_PATH: $PROJECT_PATH
    INPUT_LOG_FILE: $LOG_FILE
  rules:
    - if: '$SKIP_BUILD == "true"'
      when: never
    - when: on_success
  artifacts:
    paths:
      - $PROJECT_PATH/bin/
    expire_in: 1 day

# ============================================================================
# TEST STAGE
# ============================================================================

test:
  stage: test
  image: golang:${GO_VERSION}-alpine
  dependencies:
    - build
  script:
    # Refactored: Call shared script instead of inline logic
    - bash ./src/step-test.sh
  env:
    INPUT_PROJECT_PATH: $PROJECT_PATH
    INPUT_TESTS_PATH: $TESTS_PATH
    INPUT_LOG_FILE: $LOG_FILE
  rules:
    - if: '$SKIP_TEST == "true"'
      when: never
    - when: on_success
  coverage: '/coverage: \d+\.\d+% of statements/'
  artifacts:
    paths:
      - $PROJECT_PATH/coverage.*
    reports:
      coverage_report:
        coverage_format: cobertura
        path: $PROJECT_PATH/coverage.out
    expire_in: 30 days

# ============================================================================
# VERSIONING STAGE
# ============================================================================

versioning:
  stage: versioning
  image: golang:${GO_VERSION}-alpine
  script:
    # Refactored: Call shared script instead of inline logic
    - bash ./src/step-version.sh
  env:
    INPUT_PROJECT_PATH: $PROJECT_PATH
    INPUT_VERSION_BUMP: $VERSION_BUMP
    INPUT_LOG_FILE: $LOG_FILE
  rules:
    - if: '$SKIP_VERSIONING == "true"'
      when: never
    - when: on_success
  artifacts:
    paths:
      - version_info.txt
      - $LOG_FILE
    expire_in: 30 days

# ============================================================================
# PACKAGING STAGE
# ============================================================================

packaging:
  stage: packaging
  image: golang:${GO_VERSION}-alpine
  dependencies:
    - build
    - versioning
  script:
    # Refactored: Call shared script instead of inline logic
    - bash ./src/step-package.sh
  env:
    INPUT_PROJECT_PATH: $PROJECT_PATH
    INPUT_LOG_FILE: $LOG_FILE
  rules:
    - if: '$SKIP_PACKAGING == "true"'
      when: never
    - when: on_success
  artifacts:
    paths:
      - $PROJECT_PATH/bin/
    expire_in: 30 days

# ============================================================================
# RELEASE STAGE
# ============================================================================

release:
  stage: release
  image: golang:${GO_VERSION}-alpine
  dependencies:
    - versioning
    - packaging
  script:
    # Refactored: Call shared script instead of inline logic
    - bash ./src/step-release.sh
  env:
    INPUT_PROJECT_PATH: $PROJECT_PATH
    INPUT_REGISTRY: $REGISTRY
    INPUT_IMAGE_NAME: $IMAGE_NAME
    INPUT_GITHUB_TOKEN: $GITHUB_TOKEN
    INPUT_LOG_FILE: $LOG_FILE
    GITHUB_SHA: $CI_COMMIT_SHA
  rules:
    - if: '$SKIP_RELEASE == "true"'
      when: never
    - if: '$CI_COMMIT_BRANCH == $TARGET_BRANCH'
      when: on_success
    - when: manual
  only:
    - branches
  allow_failure: true

# ============================================================================
# REINTEGRATION STAGE
# ============================================================================

reintegration:
  stage: reintegration
  image: alpine:latest
  script:
    # Refactored: Call shared script instead of inline logic
    - bash ./src/step-reintegrate.sh
  env:
    INPUT_PROJECT_PATH: $PROJECT_PATH
    INPUT_LOG_FILE: $LOG_FILE
    INPUT_GITHUB_TOKEN: $GITHUB_TOKEN
    GITHUB_TOKEN: $GITHUB_TOKEN
  rules:
    - if: '$SKIP_REINTEGRATION == "true"'
      when: never
    - if: '$CI_COMMIT_BRANCH == $TARGET_BRANCH'
      when: on_success
    - when: manual
  allow_failure: true

# ============================================================================
# ARTIFACTS & LOGGING
# ============================================================================

publish_logs:
  stage: logs
  image: alpine:latest
  script:
    - echo "Collecting logs and artifacts..."
    - |
      if [ -f "$LOG_FILE" ]; then
        echo "Log file size: $(wc -c < $LOG_FILE) bytes"
      fi
  artifacts:
    paths:
      - $LOG_FILE
      - version_info.txt
    expire_in: 90 days
  when: always

# ============================================================================
# DASHBOARD LINK GENERATION
# ============================================================================

dashboard_link:
  stage: logs
  image: alpine:latest
  needs:
    - publish_logs
  script:
    - echo "Generating Pipery Dashboard link..."
    - |
      # Get the artifact URL from GitLab API
      ARTIFACT_URL="${CI_SERVER_URL}/api/v4/projects/${CI_PROJECT_ID}/jobs/${CI_JOB_ID}/artifacts"
      echo "Artifact URL: $ARTIFACT_URL"
      
      # URL encode the artifact path
      ENCODED_URL=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1],safe=''))" "$ARTIFACT_URL")
      
      # Create dashboard link
      DASHBOARD_URL="https://dash.pipery.dev/?artifact=${ENCODED_URL}"
      
      # Output the link in markdown format
      echo ""
      echo "=========================================="
      echo "Pipery Dashboard Link"
      echo "=========================================="
      echo "[$DASHBOARD_URL]($DASHBOARD_URL)"
      echo ""
      echo "Direct URL:"
      echo "$DASHBOARD_URL"
      echo "=========================================="
      echo ""
      
      # Save to artifact file for persistence
      mkdir -p artifacts
      echo "DASHBOARD_URL=$DASHBOARD_URL" > artifacts/dashboard_link.env
  artifacts:
    paths:
      - artifacts/
    reports:
      dotenv: artifacts/dashboard_link.env
    expire_in: 90 days
  allow_failure: true
  when: always
