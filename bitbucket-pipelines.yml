# ============================================================================
# Bitbucket Pipelines Configuration for pipery-golang-ci
# Production-Ready Go CI Pipeline
# ============================================================================
#
# SETUP INSTRUCTIONS:
# 1. Copy this file to pipery-golang-ci repository root as bitbucket-pipelines.yml
# 2. Configure Protected Variables in Bitbucket (Repo Settings > Pipelines > Repository Variables)
# 3. Set SKIP_* variables to 'true' to disable specific stages
#
# PROTECTED VARIABLES TO CONFIGURE:
# - REGISTRY_PASSWORD: Docker registry authentication token (Mark as Secured)
# - GITHUB_TOKEN: GitHub API token for reintegration (Mark as Secured)

definitions:
  steps:
    - step: &checkout-step
        name: Checkout Repository
        image: alpine:latest
        script:
          - echo "Repository checked out by Bitbucket Pipelines"
          - ls -la

    - step: &setup-step
        name: Setup Go Environment
        image: golang:1.22-alpine
        caches:
          - go
        script:
          - echo "Setting up Go CI environment..."
          - go version
          - cd ${PROJECT_PATH:-.}
          - go mod download
          - go mod verify
          - echo "Setup complete"
        artifacts:
          - go.sum
          - go.mod

    - step: &sast-scan
        name: SAST Security Scan
        image: python:3.11-alpine
        script:
          # Refactored: Call shared script instead of inline logic
          - bash ./src/step-sast.sh
        env:
          INPUT_PROJECT_PATH: ${PROJECT_PATH:-.}
          INPUT_CONFIG_FILE: ${CONFIG_FILE:-.pipery/config.yaml}
          INPUT_LOG_FILE: ${LOG_FILE:-pipery.jsonl}
        artifacts:
          - ${LOG_FILE:-pipery.jsonl}

    - step: &sca-scan
        name: SCA Dependency Scan
        image: python:3.11-alpine
        script:
          # Refactored: Call shared script instead of inline logic
          - bash ./src/step-sca.sh
        env:
          INPUT_PROJECT_PATH: ${PROJECT_PATH:-.}
          INPUT_CONFIG_FILE: ${CONFIG_FILE:-.pipery/config.yaml}
          INPUT_LOG_FILE: ${LOG_FILE:-pipery.jsonl}
        artifacts:
          - ${LOG_FILE:-pipery.jsonl}

    - step: &lint-step
        name: Code Quality Linting
        image: golang:1.22-alpine
        script:
          - echo "Installing golangci-lint..."
          - apk add --no-cache git
          - go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
          - cd ${PROJECT_PATH:-.}
          - echo "Running golangci-lint..."
          - golangci-lint run ./...
          - echo "Lint stage complete"

    - step: &build-step
        name: Build Go Binaries
        image: golang:1.22-alpine
        script:
          - echo "Building Go binaries..."
          - cd ${PROJECT_PATH:-.}
          - go build -v -o bin/ ./...
          - ls -la bin/
          - echo "Build complete"
        artifacts:
          - bin/**

    - step: &test-step
        name: Execute Unit Tests
        image: golang:1.22-alpine
        script:
          - echo "Running Go tests..."
          - cd ${PROJECT_PATH:-.}
          - go test -v -coverprofile=coverage.out -covermode=atomic ${TESTS_PATH:-.}
          - go tool cover -html=coverage.out -o coverage.html
          - echo "Tests complete"
        artifacts:
          - coverage.*

    - step: &versioning-step
        name: Version Bump & Tag
        image: golang:1.22-alpine
        script:
          - echo "Running versioning step..."
          - apk add --no-cache python3 py3-pip
          - pip install --quiet pipery-tooling
          - |
            pipery-tooling version \
              --project-path ${PROJECT_PATH:-.} \
              --version-bump ${VERSION_BUMP:-patch} \
              --log-file ${LOG_FILE:-pipery.jsonl}
          - |
            if [ -f "${PROJECT_PATH:-.}/VERSION" ]; then
              cat ${PROJECT_PATH:-.}/VERSION > version_info.txt
            elif [ -f "${PROJECT_PATH:-.}/go.mod" ]; then
              grep 'module' ${PROJECT_PATH:-.}/go.mod > version_info.txt
            fi
          - cat version_info.txt
          - echo "Versioning complete"
        artifacts:
          - version_info.txt
          - ${LOG_FILE:-pipery.jsonl}

    - step: &packaging-step
        name: Create Container Image
        image: docker:latest
        services:
          - docker
        script:
          - echo "Creating container image for Go application..."
          - |
            if [ -z "$IMAGE_NAME" ]; then
              echo "IMAGE_NAME not set, skipping Docker image creation"
              exit 0
            fi
          - echo "Building Docker image: $IMAGE_NAME"
          - docker build -t $IMAGE_NAME:latest .
          - docker images | grep $IMAGE_NAME || true
          - echo "Package (container image) created"

    - step: &release-step
        name: Release to Registry
        image: docker:latest
        services:
          - docker
        trigger: manual
        script:
          - echo "Releasing Go artifacts..."
          - |
            if [ -n "$IMAGE_NAME" ] && [ -n "$REGISTRY" ]; then
              echo "Pushing image to registry: $REGISTRY/$IMAGE_NAME"
              echo "Image would be pushed to registry"
            fi
          - echo "Release complete"

    - step: &reintegration-step
        name: Reintegration to Target Branch
        image: alpine:latest
        trigger: manual
        script:
          - echo "Reintegration step would update target branch..."
          - |
            if [ -z "$GITHUB_TOKEN" ]; then
              echo "Skipping reintegration: GITHUB_TOKEN not set"
              exit 0
            fi
          - echo "Reintegration complete"

    - step: &logs-step
        name: Collect & Archive Logs
        image: alpine:latest
        script:
          - echo "Collecting logs and artifacts..."
          - |
            if [ -f "${LOG_FILE:-pipery.jsonl}" ]; then
              echo "Log file size: $(wc -c < ${LOG_FILE:-pipery.jsonl}) bytes"
            fi
        artifacts:
          - ${LOG_FILE:-pipery.jsonl}
          - version_info.txt

variables:
  # Build Configuration
  PROJECT_PATH: "."
  CONFIG_FILE: ".pipery/config.yaml"
  GO_VERSION: "1.22"
  TESTS_PATH: "./..."

  # Feature Flags
  SKIP_SAST: "false"
  SKIP_SCA: "false"
  SKIP_LINT: "false"
  SKIP_BUILD: "false"
  SKIP_TEST: "false"
  SKIP_VERSIONING: "false"
  SKIP_PACKAGING: "false"
  SKIP_RELEASE: "false"
  SKIP_REINTEGRATION: "false"

  # Release Configuration
  VERSION_BUMP: "patch"
  REGISTRY: "ghcr.io"
  IMAGE_NAME: ""  # e.g., ghcr.io/myorg/myapp

  # Logging & Tracking
  LOG_FILE: "pipery.jsonl"
  TARGET_BRANCH: "main"

pipelines:
  default:
    - step: *checkout-step
    - step: *setup-step
    - parallel:
        - step: *sast-scan
        - step: *sca-scan
    - step:
        <<: *lint-step
        condition:
          variable:
            - SKIP_LINT = "false"
        optional: true
    - step:
        <<: *build-step
        condition:
          variable:
            - SKIP_BUILD = "false"
    - step:
        <<: *test-step
        condition:
          variable:
            - SKIP_TEST = "false"
        optional: true
    - step:
        <<: *versioning-step
        condition:
          variable:
            - SKIP_VERSIONING = "false"
    - step:
        <<: *packaging-step
        condition:
          variable:
            - SKIP_PACKAGING = "false"
    - step: *logs-step

  branches:
    main:
      - step: *checkout-step
      - step: *setup-step
      - parallel:
          - step: *sast-scan
          - step: *sca-scan
      - step:
          <<: *lint-step
          condition:
            variable:
              - SKIP_LINT = "false"
          optional: true
      - step:
          <<: *build-step
          condition:
            variable:
              - SKIP_BUILD = "false"
      - step:
          <<: *test-step
          condition:
            variable:
              - SKIP_TEST = "false"
          optional: true
      - step:
          <<: *versioning-step
          condition:
            variable:
              - SKIP_VERSIONING = "false"
      - step:
          <<: *packaging-step
          condition:
            variable:
              - SKIP_PACKAGING = "false"
      - step:
          <<: *release-step
          condition:
            variable:
              - SKIP_RELEASE = "false"
      - step:
          <<: *reintegration-step
          condition:
            variable:
              - SKIP_REINTEGRATION = "false"
          optional: true
      - step: *logs-step

  pull-requests:
    feature/**:
      - step: *checkout-step
      - step: *setup-step
      - parallel:
          - step: *sast-scan
          - step: *sca-scan
      - step:
          <<: *lint-step
          condition:
            variable:
              - SKIP_LINT = "false"
          optional: true
      - step:
          <<: *build-step
          condition:
            variable:
              - SKIP_BUILD = "false"
      - step:
          <<: *test-step
          condition:
            variable:
              - SKIP_TEST = "false"
          optional: true
      - step: *logs-step

  custom:
    release:
      - step: *checkout-step
      - step: *setup-step
      - parallel:
          - step: *sast-scan
          - step: *sca-scan
      - step:
          <<: *lint-step
          condition:
            variable:
              - SKIP_LINT = "false"
          optional: true
      - step:
          <<: *build-step
          condition:
            variable:
              - SKIP_BUILD = "false"
      - step:
          <<: *test-step
          condition:
            variable:
              - SKIP_TEST = "false"
          optional: true
      - step:
          <<: *versioning-step
          condition:
            variable:
              - SKIP_VERSIONING = "false"
      - step:
          <<: *packaging-step
          condition:
            variable:
              - SKIP_PACKAGING = "false"
      - step:
          <<: *release-step
          condition:
            variable:
              - SKIP_RELEASE = "false"
      - step:
          <<: *reintegration-step
          condition:
            variable:
              - SKIP_REINTEGRATION = "false"
          optional: true
      - step: *logs-step
